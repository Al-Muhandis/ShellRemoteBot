---
name: Make

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build on Linux
      if: runner.os != 'Windows'
      shell: bash
      run: bash -x '.github/workflows/make.sh' build

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: pwsh -File '.github/workflows/make.ps1' build
