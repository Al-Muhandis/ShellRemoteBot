---
name: Make

# Push checks run only on working branches, never on master; merges into
# master are checked via pull_request runs instead
on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Full history with tags: make.ver.sh derives the version from git describe
        fetch-depth: 0
        submodules: true

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        bash -x make.sh build
        bash make.sh dpkg "tgshd_$(bash make.ver.sh)_amd64"

    - name: Upload Linux artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: tgshd-linux-amd64
        if-no-files-found: error
        path: |
          src/x86_64-linux/tgshd
          tgshd_*.deb

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        bash make.ver.sh
        pwsh -File make.ps1 build

    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: tgshd-win64
        if-no-files-found: error
        path: src/x86_64-win64/tgshd.exe
