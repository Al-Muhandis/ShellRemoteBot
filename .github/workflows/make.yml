---
name: Make

# Push checks run only on working branches, never on master; merges into
# master are checked via pull_request runs instead
on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # A flaky SourceForge download on one OS must not cancel the other job
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Full history with tags: make.ver.sh derives the version from git describe
        fetch-depth: 0
        submodules: true

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        bash -x make.sh build
        bash make.sh dpkg "tgshd_$(bash make.ver.sh)_amd64"

    - name: Run tests on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: bash -x make.sh test

    - name: Upload Linux artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: tgshd-linux-amd64
        if-no-files-found: error
        path: |
          src/x86_64-linux/tgshd
          tgshd_*.deb

    - name: Resolve Lazarus installer name for the cache key
      if: runner.os == 'Windows'
      id: lazarus
      shell: pwsh
      run: |
        # Keep the cache key in sync with the installer version in make.ps1:
        # a changed installer name automatically invalidates the cache
        $File = (Select-String -Path make.ps1 -Pattern "File = '(lazarus-[^']+\.exe)'").Matches[0].Groups[1].Value
        "key=$File" >> $env:GITHUB_OUTPUT

    - name: Cache Lazarus on Windows
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        # Exact key only: with restore-keys a stale C:\Lazarus of an older
        # Lazarus could be silently reused instead of reinstalling
        key: ${{ steps.lazarus.outputs.key }}
        path: C:\Lazarus

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        bash make.ver.sh
        pwsh -File make.ps1 build

    - name: Run tests on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: pwsh -File make.ps1 test

    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: tgshd-win64
        if-no-files-found: error
        path: src/x86_64-win64/tgshd.exe
